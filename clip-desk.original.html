<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clip Desk</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#16171a;--panel:#1d1f23;--panel2:#25272c;--field:#131417;--line:#2f3238;--tx:#e7e9ed;--mut:#8d929c;--acc:#4d8dff;--ok:#3fb68b;--warn:#e0a23b;--r:6px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:13px/1.5 Inter,system-ui,sans-serif}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
header{display:flex;align-items:center;gap:14px;height:48px;padding:0 20px;border-bottom:1px solid var(--line);background:var(--panel)}
h1{font:600 15px Inter,sans-serif;margin:0}
#status{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--mut)}
#status::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--warn)}
#status.on::before{background:var(--ok)}
main{display:grid;grid-template-columns:310px minmax(340px,1fr) 450px;gap:16px;padding:16px 20px;align-items:start}
@media(max-width:1100px){main{grid-template-columns:1fr}}
section{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
h2{font-size:12px;font-weight:600;letter-spacing:.2px;margin:-14px -14px 12px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel2);border-radius:var(--r) var(--r) 0 0;color:var(--mut)}
h3{font-size:12px;margin:16px 0 6px;color:var(--mut);font-weight:600;padding-top:10px;border-top:1px solid var(--line)}
h3:first-child{border-top:0;padding-top:0;margin-top:0}
.seg{display:flex;background:var(--field);border:1px solid var(--line);border-radius:var(--r);padding:2px;margin-bottom:10px}
.seg button{flex:1;background:none;border:0;padding:6px;cursor:pointer;color:var(--mut);border-radius:4px}
.seg button.on{background:var(--acc);color:#fff;font-weight:600}
.f{display:grid;grid-template-columns:108px 1fr 48px;gap:8px;align-items:center;margin:5px 0}
.f label{color:var(--mut)}
.f input[type=range]{width:100%;accent-color:var(--acc)}
.f input[type=number],.f select,.f input[type=text],.f input[type=color]{background:var(--field);border:1px solid var(--line);border-radius:4px;padding:3px 6px;width:100%;height:28px}
.f output{font-size:12px;color:var(--mut);text-align:right;font-variant-numeric:tabular-nums}
.f.n{grid-template-columns:108px 1fr}
.stage{display:flex;flex-direction:column;align-items:center;gap:16px}
.backdrop{width:100%;padding:24px 0;border-radius:var(--r);background:#101113;border:1px solid var(--line);display:flex;justify-content:center}
.phone{position:relative;width:302px;height:538px;border-radius:12px;overflow:hidden;background:#000;box-shadow:0 0 0 1px #3a3d44}
.phone>*{position:absolute;left:0;width:100%}
.face{top:0;background:#3a3f4b;display:grid;place-items:center}
.game{background:#2b2f38;display:grid;place-items:center}
.phone span{color:#ffffff80;font-size:12px}
.meme{text-align:center;color:#fff;font:400 30px/1.05 Anton,Impact,sans-serif;paint-order:stroke fill;padding:0 12px}
.bgb{inset:0;height:100%;background:linear-gradient(160deg,#2b2f38,#5a5f6b,#3a3f4b);filter:blur(14px);transform:scale(1.2)}
.mini{position:absolute;background:#3a3f4b;border:1px solid #ffffff40;display:grid;place-items:center}
.cap{text-align:center;color:#fff;font:400 24px Anton,Impact,sans-serif;paint-order:stroke fill;-webkit-text-stroke:5px #000}
.cap u{text-decoration:none;color:#ffe600}
.src{position:relative;width:320px;height:180px;background:#101113;border:1px solid var(--line);border-radius:4px}
.src i{position:absolute;border:1.5px solid var(--acc);background:#4d8dff26}
.cap2{color:var(--mut);font-size:12px;margin-top:6px;text-align:center}
.steps{display:flex;gap:6px;margin-bottom:12px}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);padding:7px 12px;cursor:pointer}
.btn:hover{border-color:#4a4e57}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.btn.p:hover{filter:brightness(1.1)}
.steps .btn{flex:1;padding:7px 6px}
table{width:100%;border-collapse:collapse}
td,th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{color:var(--mut);font-weight:500;font-size:12px}
td input[type=text]{width:100%;background:var(--field);border:1px solid var(--line);border-radius:4px;padding:4px 6px}
td input[type=checkbox]{accent-color:var(--acc)}
.tag{font-size:11px;padding:1px 7px;border-radius:4px;background:#2f3238}
.warn{background:#3d2f14;color:var(--warn)}
.empty{color:var(--mut);padding:16px 0}
#log{margin-top:12px;background:var(--field);border:1px solid var(--line);border-radius:var(--r);height:170px;overflow:auto;padding:10px;font:12px/1.5 ui-monospace,Consolas,monospace;white-space:pre-wrap;color:#b9bdc6}
.row{display:flex;gap:8px;margin-bottom:10px}
.row input{flex:1;background:var(--field);border:1px solid var(--line);border-radius:4px;padding:6px 8px}
</style>
</head>
<body>
<header><h1>Clip Desk</h1><span style="color:var(--mut)">GTA 5 / GTA 6 shorts</span><span id="status">Checking backend…</span></header>
<main>

<section aria-label="Settings">
  <h2>Layout and style</h2>
  <div class="seg" id="seg"><button data-l="A">Blurred background</button><button data-l="B" class="on">Split screen</button></div>
  <div id="fields"></div>
  <div class="row" style="margin-top:14px"><button class="btn p" id="save" style="flex:1">Save settings</button><button class="btn" id="reload">Reload</button></div>
</section>

<section class="stage" aria-label="Preview" style="background:none;border:0;padding:0">
  <div class="backdrop"><div class="phone" id="phone"></div></div>
  <div><div class="src" id="src"></div><div class="cap2">Facecam area in your source video</div></div>
</section>

<section aria-label="Pipeline">
  <h2>Clips</h2>
  <div class="row"><input id="source" type="text" value="input/sample.mp4" aria-label="Source video path"></div>
  <div class="steps">
    <button class="btn" id="s1">1. Find clips</button>
    <button class="btn" id="s2">2. Write captions</button>
    <button class="btn p" id="s3">3. Render selected</button>
  </div>
  <table><thead><tr><th></th><th>Clip</th><th>Hook text</th><th></th></tr></thead><tbody id="clips"></tbody></table>
  <div id="log" role="log" aria-live="polite"></div>
</section>
</main>

<script>
/* ===== Backend contract (the IDE agent implements this; see prompt) =====
 GET  /api/health            -> {ok:true}
 GET  /api/config            -> {KEY:value,...}  (config.env + CAP_* keys)
 POST /api/config {..}       -> {ok:true}        (writes config.env)
 GET  /api/clips             -> [clips.json rows]
 POST /api/jobs {type:'find_clips'|'transcribe'|'render', source, clips:[{file,hook,layout}]} -> {job_id}
 GET  /api/jobs/:id          -> {status:'running'|'done'|'error', log:[lines], outputs:[paths]}
==========================================================================*/
const SCHEMA=[
 ['Source video',null,[['SRC_W','Width','number',1920],['SRC_H','Height','number',1080]]],
 ['Facecam in source',null,[['FACE_X','Left','number',1440],['FACE_Y','Top','number',0],['FACE_W','Width','number',480],['FACE_H','Height','number',270]]],
 ['Split screen','B',[['B_TOP_PCT','Facecam share','range',30,15,50,1,'%'],['B_DIV_PX','Divider','range',8,2,24,1,'px'],['B_DIV_COLOR','Divider colour','color','#ffd23f'],['B_FACE_FIT','Facecam fit','select','cover',['cover','contain']]]],
 ['Blurred background','A',[['A_PANEL_H','Gameplay height','range',1080,700,1920,10,'px'],['A_BLUR','Blur','range',10,2,30,1],['A_FACE_W','Facecam width','range',340,200,500,10,'px'],['A_FACE_RIGHT','Right gap','range',30,0,120,5,'px'],['A_FACE_BOTTOM','Bottom gap','range',70,0,300,5,'px']]],
 ['Meme text',null,[['MEME_SIZE','Size','range',110,60,180,2],['MEME_BORDER','Outline','range',9,3,16,1,'px'],['MEME_Y_PCT','Position','range',8,0,40,1,'%'],['MEME_SECONDS','Show for','range',0,0,10,1,'s']]],
 ['Captions',null,[['CAP_STYLE','Style','select','auto',['auto','karaoke','meme']],['CAP_CHUNK','Words at once','range',3,1,5,1],['CAP_HL','Highlight','color','#ffe600'],['CAP_UPPER','Capitals','select','no',['no','yes']]]],
 ['Quality',null,[['ENCODER','Encoder','select','libx264',['libx264','h264_qsv']],['CRF','Quality (lower = better)','range',20,16,28,1],['PRESET','Speed','select','medium',['veryfast','fast','medium','slow']]]]
];
const V={},$=s=>document.querySelector(s);let L='B',clips=[],live=false;

function build(){
  const box=$('#fields');box.innerHTML='';
  SCHEMA.forEach(([title,only,fs])=>{
    const h=document.createElement('h3');h.textContent=title;h.dataset.only=only||'';box.append(h);
    fs.forEach(([k,lab,t,d,a,b,s,u])=>{
      if(!(k in V))V[k]=d;
      const w=document.createElement('div');w.className='f'+(t=='range'?'':' n');w.dataset.only=only||'';
      let inp;
      if(t=='select'){inp=document.createElement('select');a.forEach(o=>inp.add(new Option(o,o)))}
      else{inp=document.createElement('input');inp.type=t;if(t=='range'){inp.min=a;inp.max=b;inp.step=s}}
      inp.value=V[k];inp.id='f_'+k;
      const l=document.createElement('label');l.textContent=lab;l.htmlFor=inp.id;w.append(l,inp);
      if(t=='range'){const o=document.createElement('output');o.textContent=V[k]+(u||'');w.append(o);inp.oninput=()=>{V[k]=inp.value;o.textContent=inp.value+(u||'');draw()}}
      else inp.oninput=()=>{V[k]=inp.value;draw()};
      box.append(w);
    });
  });
  vis();
}
function vis(){document.querySelectorAll('[data-only]').forEach(e=>e.hidden=e.dataset.only&&e.dataset.only!==L)}
function sync(){for(const k in V){const e=$('#f_'+k);if(e)e.value=V[k];const o=e&&e.nextElementSibling;if(o&&o.tagName=='OUTPUT')o.textContent=V[k]+(o.textContent.replace(/[\d.-]/g,''))}}

function draw(){
  const k=.28,W=1080*k,H=1920*k,g=x=>+V[x];let h='';
  if(L=='B'){
    const t=Math.round(H*g('B_TOP_PCT')/100),d=Math.max(1,g('B_DIV_PX')*k);
    h=`<div class="face" style="height:${t}px"><span>facecam</span></div>
    <div class="game" style="top:${t}px;height:${H-t}px"><span>gameplay</span></div>
    <i style="top:${t-d/2}px;height:${d}px;background:${V.B_DIV_COLOR}"></i>
    <b class="meme" style="top:${t+(H-t)*g('MEME_Y_PCT')/100}px;font-size:${g('MEME_SIZE')*k}px;-webkit-text-stroke:${g('MEME_BORDER')*k*1.6}px #000">HOW HE CLIMBED</b>`;
  }else{
    const p=g('A_PANEL_H')*k,fw=g('A_FACE_W')*k,fh=fw*g('FACE_H')/g('FACE_W');
    h=`<div class="bgb"></div><div class="game" style="top:${(H-p)/2}px;height:${p}px"><span>gameplay</span></div>
    <div class="mini" style="width:${fw}px;height:${fh}px;right:${g('A_FACE_RIGHT')*k}px;bottom:${g('A_FACE_BOTTOM')*k}px;left:auto"><span>facecam</span></div>
    <b class="cap" style="bottom:${560*k}px;-webkit-text-stroke-width:${7*k*1.6}px">he <u style="color:${V.CAP_HL}">climbed</u> on</b>`;
  }
  $('#phone').innerHTML=h;
  const s=320/g('SRC_W');
  $('#src').innerHTML=`<i style="left:${g('FACE_X')*s}px;top:${g('FACE_Y')*s}px;width:${g('FACE_W')*s}px;height:${g('FACE_H')*s}px"></i>`;
}

function log(m){const e=$('#log');e.textContent+=m+'\n';e.scrollTop=e.scrollHeight}
async function api(p,o={}){const r=await fetch(p,{headers:{'Content-Type':'application/json'},...o});if(!r.ok)throw new Error(p+' '+r.status);return r.json()}

function renderClips(){
  const tb=$('#clips');
  if(!clips.length){tb.innerHTML='<tr><td colspan="4" class="empty">No clips yet. Choose “1. Find clips” to scan your video.</td></tr>';return}
  tb.innerHTML=clips.map((c,i)=>`<tr><td><input type="checkbox" data-i="${i}" checked aria-label="Select ${c.file}"></td>
   <td>${c.file}<br><small style="color:var(--mut)">${(+c.start_sec).toFixed(1)}–${(+c.end_sec).toFixed(1)}s · ${c.event_type}</small>${c.music_audible?'<br><span class="tag warn">music audible</span>':''}</td>
   <td><input type="text" data-h="${i}" value="${(c.hook_en||'').replace(/"/g,'&quot;')}" aria-label="Hook text"></td>
   <td><button class="btn" data-one="${i}">Render</button></td></tr>`).join('');
}
const DEMO=[{file:'clip_01.mp4',start_sec:12.4,end_sec:41,event_type:'crash',hook_en:'HOW HE CLIMBED',music_audible:false},{file:'clip_02.mp4',start_sec:95,end_sec:128.5,event_type:'chase',hook_en:'COPS GAVE UP',music_audible:true}];

async function job(body,label){
  log('> '+label);
  if(!live){log('Demo mode: backend not running, nothing executed.');return}
  try{
    const {job_id}=await api('/api/jobs',{method:'POST',body:JSON.stringify(body)});let n=0;
    for(;;){await new Promise(r=>setTimeout(r,1000));const j=await api('/api/jobs/'+job_id);
      j.log.slice(n).forEach(log);n=j.log.length;
      if(j.status!='running'){log(j.status=='done'?'Finished: '+(j.outputs||[]).join(', '):'Failed. See the lines above.');if(j.status=='done'&&body.type=='find_clips')loadClips();break}}
  }catch(e){log('Error: '+e.message)}
}
async function loadClips(){try{clips=await api('/api/clips')}catch{clips=live?[]:DEMO}renderClips()}
function picked(){return [...document.querySelectorAll('[data-i]:checked')].map(c=>{const i=+c.dataset.i;return{file:clips[i].file,hook:document.querySelector(`[data-h="${i}"]`).value,layout:L}})}

$('#seg').onclick=e=>{const b=e.target.closest('button');if(!b)return;L=b.dataset.l;document.querySelectorAll('#seg button').forEach(x=>x.classList.toggle('on',x===b));vis();draw()};
$('#save').onclick=async()=>{if(!live){log('Demo mode: settings kept in this page only.');return}try{await api('/api/config',{method:'POST',body:JSON.stringify({...V,LAYOUT:L})});log('Settings saved to config.env')}catch(e){log('Error: '+e.message)}};
$('#reload').onclick=init;
$('#s1').onclick=()=>job({type:'find_clips',source:$('#source').value},'Finding clips in '+$('#source').value);
$('#s2').onclick=()=>job({type:'transcribe',clips:picked()},'Writing captions');
$('#s3').onclick=()=>{const c=picked();if(!c.length){log('Select at least one clip.');return}job({type:'render',clips:c},'Rendering '+c.length+' clip(s) as layout '+L)};
$('#clips').onclick=e=>{const i=e.target.dataset.one;if(i==null)return;const c=clips[i];job({type:'render',clips:[{file:c.file,hook:document.querySelector(`[data-h="${i}"]`).value,layout:L}]},'Rendering '+c.file)};

async function init(){
  try{await api('/api/health');live=true}catch{live=false}
  const s=$('#status');s.textContent=live?'Backend connected':'Demo mode (no backend)';s.className=live?'on':'';
  if(live){try{Object.assign(V,await api('/api/config'))}catch{}}
  build();sync();await loadClips();draw();
}
init();
</script>
</body>
</html>
