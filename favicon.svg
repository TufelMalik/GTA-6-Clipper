<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="gta-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#ef4444" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#121316" stroke="url(#border-grad)" stroke-width="2.5"/>

  <!-- Clapper / Film Clipper Body -->
  <g filter="url(#neon-glow)">
    <!-- Clapper Top bar with angled slant -->
    <path d="M 16 18 L 48 18 L 45 26 L 19 26 Z" fill="url(#gta-grad)"/>
    <!-- Zebra cuts on clapper top -->
    <path d="M 23 18 L 27 18 L 24 26 L 20 26 Z" fill="#ffffff" opacity="0.9"/>
    <path d="M 33 18 L 37 18 L 34 26 L 30 26 Z" fill="#ffffff" opacity="0.9"/>
    <path d="M 43 18 L 47 18 L 44 26 L 40 26 Z" fill="#ffffff" opacity="0.9"/>

    <!-- Clapper Lower Screen Box -->
    <rect x="16" y="28" width="32" height="20" rx="5" fill="url(#gta-grad)"/>

    <!-- Play Arrow Wedge (Cutout effect) -->
    <path d="M 28 32 L 40 38 L 28 44 Z" fill="#121316"/>
  </g>
</svg>
